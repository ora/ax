name: Release

# Two halves, both automatic, nothing to dispatch by hand:
#
#   1. release-please (runs on every push to main). Reads conventional commits
#      since the last tag, and opens or updates a single "chore(main): release
#      X.Y.Z" PR that bumps package.json and CHANGELOG.md. Merging that PR is the
#      release decision. On the push that merges it, release-please tags the
#      commit and creates the GitHub Release.
#
#   2. publish (only when that push produced a release). Re-runs the full gate,
#      builds, verifies the tarball and publishes to npm with provenance via
#      OIDC Trusted Publishing.
#
# No loop: publish never commits anything, and release-please only commits via
# its own PR. Every push to main therefore runs at most one release-please
# check and zero or one publish.
#
# The filename is load-bearing: the npm trusted publisher for `ax` is bound to
# `release.yml`. Rename it and publishes are rejected until npmjs.com is updated.
on:
  push:
    branches: [main]
  # Manual dispatch is for the publish half only: rehearse it (dry_run), or
  # retry a publish that failed after the release PR already merged and the
  # tag already exists (dispatch from that tag, not from main). It never bumps
  # or tags anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the publish — build and validate, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a release mid-flight; a half-finished publish is the one state
# with no clean recovery.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # PRs opened with the built-in GITHUB_TOKEN never trigger
          # `pull_request` workflows, so the release PR would sit with its
          # required checks stuck at "expected" until a human closed and
          # reopened it. A fine-grained PAT (contents + pull-requests: write on
          # this repo) makes the PR run checks like any other. Falls back to the
          # built-in token when the secret is absent — see RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    # Runs when release-please just cut a release, or on manual dispatch (which
    # skips release-please entirely — `needs` then reports it as skipped, hence
    # the `!cancelled()` guard instead of the implicit success() check).
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm provenance attestation
    env:
      # setup-node writes an .npmrc referencing ${NODE_AUTH_TOKEN}, so every npm and
      # pnpm call warns until something defines it. Publishing itself is tokenless
      # (OIDC Trusted Publishing); the empty default only silences a warning that
      # otherwise buries real errors in the log.
      NODE_AUTH_TOKEN: ""
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the preflight check confirms the tag exists.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Re-run the full gate here rather than trusting the green CI run on the
      # same SHA: npm versions are forever.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      # The version is whatever main says. release-please already committed the
      # bump; nothing here ever edits package.json.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "name=$(node -p "require('./package.json').name")"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $version from $(git rev-parse --short HEAD)"

      # Idempotent by design: a retry after a publish that already succeeded is
      # a no-op, not a failure. The tag check catches a manual dispatch from a
      # commit that was never released, or from one that is not the release.
      - name: Preflight — tag and registry check
        id: preflight
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PKG: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ]; then
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG does not exist — merge the release PR first; publish never tags"
              exit 1
            fi
            # The tag existing is not enough: main may have moved on since the
            # release commit (a retry after a failed publish, or a queued run
            # that was superseded). Only the tagged commit may ship as $TAG.
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            head=$(git rev-parse HEAD)
            if [ "$tagged" != "$head" ]; then
              echo "::error::HEAD $head is not the commit tagged $TAG ($tagged) — re-run the workflow from the tag $TAG, not from a branch"
              exit 1
            fi
          fi
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already on npm — nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Clear to publish $PKG@$VERSION as $TAG"

      - name: Build
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm build

      - name: Smoke test bundled CLI
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm smoke

      # Catches publishing an unbuilt or truncated bundle — npm would accept it
      # silently and break every `npx ax`. Last chance while the version
      # is still free; once published it can never be reused.
      - name: Verify publishable tarball
        if: steps.preflight.outputs.skip != 'true'
        run: pnpm verify:pack

      # OIDC Trusted Publishing (configured on npmjs.com for this repo +
      # workflow) needs npm >= 11.5.1 for the token exchange; Node 22 bundles
      # npm 10, which would silently skip OIDC and fail as unauthenticated.
      - name: Upgrade npm for OIDC Trusted Publishing
        if: steps.preflight.outputs.skip != 'true'
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish to npm
        if: steps.preflight.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # No --provenance: attestations require a real publish to sign.
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi

      - name: Summary
        if: always()
        env:
          PKG: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SKIPPED: ${{ steps.preflight.outputs.skip }}
        run: |
          {
            echo "## Publish ${TAG:-(not reached)}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${PKG:-?}\` |"
            echo "| Version | \`${VERSION:-?}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Already on npm | \`${SKIPPED:-?}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "Rehearsal only — nothing was published."
            else
              echo "https://www.npmjs.com/package/${PKG:-}/v/${VERSION:-}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
